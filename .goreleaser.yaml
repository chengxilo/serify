# The `serify` CLI half of a release. The nine worker libraries go to their own
# registries by hand — goreleaser has no notion of crates.io, PyPI, hex.pm or
# Maven Central — those are separate jobs in .github/workflows/release.yml.

version: 2

project_name: serify

builds:
  - id: serify
    main: ./cmd/serify
    binary: serify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM has no plausible user here and doubles nothing but the
      # release page's length.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # .Tag, not .Version: .Version drops the leading v, and a `go install`ed
    # binary reports its module version *with* the v. Same tag, two install
    # paths, one string.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: serify
    ids:
      - serify
    name_template: "serify-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Otherwise unpacking scatters the binary, LICENSE and README into whatever
    # directory the user happened to be in.
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

checksum:
  name_template: SHA256SUMS

release:
  # The C++ library is one header with no registry to publish to, so the
  # release page is where a C++ worker gets it.
  extra_files:
    - glob: lib/cpp/serify.hpp

changelog:
  use: github
