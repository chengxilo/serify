# yaml-language-server: $schema=.schemas/address.schema.json
# A postal address — reusable type (no cases), pulled in via `import:`.
# postal_code is a string on purpose: real postal codes have leading zeros
# and letters (e.g. "M5V 2T6", "01234").
fields:
  - recipient: string
  - street: string
  - city: string
  - country: string      # ISO 3166-1 alpha-2, e.g. "CA"
  - postal_code: string
