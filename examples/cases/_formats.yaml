# Format registry for this suite. Every case file's `formats:` must pick from
# this list; `serify schema` enforces it and bakes it into the generated
# schemas as the enum. Add new worker-supported formats here first.
# (The "_" prefix keeps this file out of case-file loading.)
#
# Names only. The comparison oracle is NOT declared here: it belongs to the
# (type, format) pair and lives in each type file's `formats:` list, because one
# format name is shared by types that want opposite verdicts — `binary` is
# `bytes` for ledger (byte parity across all nine languages) and `semantic` for
# customer (which holds a map, so entry order is free). An `oracle:` in this
# file is a load error rather than being silently ignored.
#
# See docs/protocol.md § Comparison oracles.
formats:
  - binary
  - json
