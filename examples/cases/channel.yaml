# yaml-language-server: $schema=.schemas/reusable.schema.json
# How a notification is delivered: exactly one of these variants. A `variants:`
# section declares a sum: each entry is `tag: payload`, the payload types are
# ordinary schema expressions, and an entry with no type is a unit variant.
#
# The tag ordinal is the variant's position here, which is the one thing every
# worker must agree on. Referenced as a field (`channel: channel`) this is the
# variant itself, not a struct wrapping one.
import:
  - money.yaml

variants:
  - silent:              # arity 0 — a unit variant, no payload
  - sms: string          # arity 1 — a scalar payload
  - push: uint64         # arity 1 — a payload whose wire form is a decimal string
  - invoice: money       # arity N — a struct payload carrying several fields
