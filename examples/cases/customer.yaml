  - name: unicode
    data:
      customer_id: 90211056
      email: "kenji@example.jp"
      display_name: "健二🎮 (けんじ)"
      age: 27
      email_verified: true
      fraud_score: 0.11
      loyalty_points: 300
      signup_ts: 1751328000
      avatar_sha256: "deadbeef"
      pin: [7, 7, 7, 7]
      referral_code: "紹介コード"
      store_credit:
        currency: "JPY"
        amount_minor: 1200
      shipping_addresses:
        - recipient: "田中 健二"
          street: "渋谷区道玄坂２丁目"
          city: "東京"
          country: "JP"
          postal_code: "150-0043"
        - recipient: "مرحبا Привет"
          street: "1 Mixed-Script Way"
          city: "Zürich"
          country: "CH"
          postal_code: "8001"
      address_book:
        自宅:
          recipient: "田中 健二"
          street: "渋谷区道玄坂２丁目"
          city: "東京"
          country: "JP"
