# yaml-language-server: $schema=.schemas/customer.schema.json
# A store account. Covers: uint8/uint32/uint64, int64, float32, bool, string,
# bytes, array<uint8,N>, optional<string>, struct (money), list<struct>
# (address), list<string>, map<string,string>, map<string,struct> (address).

# All reused types come in via import (there is no implicit registry).
import:
  - address.yaml
  - money.yaml

fields:
  - customer_id: uint64
  - email: string
  - display_name: string
  - age: uint8
  - email_verified: bool
  - fraud_score: float32          # 0.0 (clean) .. 1.0 (block)
  - loyalty_points: uint32
  - signup_ts: int64              # unix seconds
  - avatar_sha256: bytes
  - pin: array<uint8,4>
  - referral_code: optional<string>
  - store_credit: money
  - shipping_addresses: list<address>
  - address_book: map<string,address>   # label ("home", "work") → address
  - wishlist_skus: list<string>
  - preferences: map<string,string>

# Serialization formats to test this type with. Each worker is re-initialized
# once per format; workers that don't implement a format are skipped for it.
formats:
  - name: binary
    oracle: semantic
  - name: json
    oracle: semantic

cases:
  - name: typical
    data:
      customer_id: 90211054
      email: "dana.wong@example.com"
      display_name: "Dana Wong"
      age: 34
      email_verified: true
      fraud_score: 0.03
      loyalty_points: 12850
      signup_ts: 1735689600            # 2025-01-01T00:00:00Z
      avatar_sha256: "b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9"
      pin: [4, 9, 3, 1]
      referral_code: "FRIEND-2025"
      store_credit:
        currency: "USD"
        amount_minor: 2500
      shipping_addresses:
        - recipient: "Dana Wong"
          street: "312 Queen St W"
          city: "Toronto"
          country: "CA"
          postal_code: "M5V 2A2"
        - recipient: "D. Wong (office)"
          street: "1 University Ave, Floor 9"
          city: "Toronto"
          country: "CA"
          postal_code: "M5J 2P1"
      address_book:
        home:
          recipient: "Dana Wong"
          street: "312 Queen St W"
          city: "Toronto"
          country: "CA"
          postal_code: "M5V 2A2"
        work:
          recipient: "D. Wong (office)"
          street: "1 University Ave, Floor 9"
          city: "Toronto"
          country: "CA"
          postal_code: "M5J 2P1"
      wishlist_skus: ["KB-750-BLK", "MON-27-4K"]
      preferences:
        theme: "dark"
        locale: "en-CA"
        newsletter: "weekly"

  - name: new_account
    data:
      customer_id: 90211055
      email: "new.user@example.com"
      display_name: ""
      age: 0
      email_verified: false
      fraud_score: 0.0
      loyalty_points: 0
      signup_ts: 1767225600            # 2026-01-01T00:00:00Z
      avatar_sha256: []
      pin: [0, 0, 0, 0]
      referral_code: null
      store_credit:
        currency: "USD"
        amount_minor: 0
      shipping_addresses: []
      address_book: {}
      wishlist_skus: []
