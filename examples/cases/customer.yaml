  - name: boundary
    data:
      customer_id: 18446744073709551615   # max uint64
      email: ""
      display_name: ""
      age: 255                            # max uint8
      email_verified: false
      fraud_score: 3.4028234663852886e+38 # max float32
      loyalty_points: 4294967295          # max uint32
      signup_ts: -9223372036854775808     # min int64
      avatar_sha256: [0xff]
      pin: [255, 0, 255, 0]
      referral_code: ""                   # present but empty != null
      store_credit:
        currency: "USD"
        amount_minor: -9223372036854775808  # min int64: maximally in debt
      shipping_addresses: []
      address_book:
        "":                               # empty key, empty struct fields
          recipient: ""
          street: ""
          city: ""
          country: ""
          postal_code: ""
      wishlist_skus: [""]
      preferences:
        "": ""

  # Characters where JSON encoders diverge across languages. Go's encoding/json
  # HTML-escapes <, > and & unless SetEscapeHTML(false) is set (the Go worker
  # sets it), and escapes U+2028/U+2029 unconditionally — no other language's
  # encoder does either by default. Ampersands in company names and angle
  # brackets in user-supplied text are ordinary production data, so a worker
  # that gets this wrong ships a real byte divergence.
  - name: text_escapes
    data:
      customer_id: 77
      email: "ops+a&b@example.com"
      display_name: "Procter & Gamble <procurement>"
      age: 40
      email_verified: true
      fraud_score: 0.5
      loyalty_points: 1
      signup_ts: 1735689600
      avatar_sha256: [0x3c, 0x3e, 0x26]
      pin: [1, 2, 3, 4]
      referral_code: "A&W<2025>"
      store_credit:
        currency: "USD"
        amount_minor: 1
      shipping_addresses:
        - recipient: "Marks & Spencer"
          street: "1 <Main> St"
          city: "Leeds"
          country: "GB"
          postal_code: "LS1 1AA"
      address_book:
        "work&home":
          recipient: "R&D <team>"
          street: "2 Elm & Oak"
          city: "Leeds"
          country: "GB"
          postal_code: "LS1 1AB"
      wishlist_skus: ["SKU-<1>", "SKU&2", "\u2028line-sep", "\u2029para-sep"]
      preferences:
        "note<key>": "a & b"
        "html": "<script>alert(1)</script>"
