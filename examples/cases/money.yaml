# yaml-language-server: $schema=.schemas/reusable.schema.json
# A monetary amount — reusable type (no cases), pulled in via `import:`.
# Amounts are integer minor units (cents), never floats; negative values
# are refunds/debits.

fields:
  - currency: string       # ISO 4217, e.g. "USD"
  - amount_minor: int64    # minor units (cents); negative = refund/debit
