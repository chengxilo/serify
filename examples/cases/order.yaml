# yaml-language-server: $schema=.schemas/order.schema.json
# A placed order. Covers: uint8/uint16/uint64, int64, bool, string, deep
# struct nesting (line_item → money), list<struct>, list<string>,
# optional<struct>, optional<string>, map<string,struct>.

import:
  - address.yaml
  - money.yaml
  - line_item.yaml

fields:
  - order_id: uint64
  - customer_id: uint64
  - created_at: int64                  # unix seconds
  - status: "enum<pending, paid, shipped, delivered, cancelled>"
  - items: list<line_item>
  - subtotal: money
  - adjustments: map<string,money>     # e.g. tax, shipping, promo (negative)
  - total: money
  - shipping_address: address
  - billing_address: optional<address> # null = same as shipping
  - coupon_codes: list<string>
  - tracking_number: optional<string>  # null until shipped

# Only the go worker implements order so far, and only in binary. Every other
# language declares the gap in examples/cases/expected_skips/<lang>.yaml.
formats:
  - name: binary
    oracle: semantic

