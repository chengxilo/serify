# yaml-language-server: $schema=.schemas/op.schema.json
# The operation a request asks for — the C, R, U and D, plus a list.
#
# A sum is the right shape here and a `kind` enum beside a flat payload is not:
# a delete carries an id and nothing else, a create carries a draft and no id at
# all, and there is no way to write those as one flat record without inventing
# defaults for every field the current operation does not use. Here each arm
# carries exactly its own payload, and a request that names two is unwritable.
#
# The three payload arities all appear:
#
#   list_all        arity 0 — a unit variant, no payload
#   read / delete   arity 1 — a scalar payload (the id)
#   create / update arity N — a struct payload
#
# Wire: u8 tag ordinal (declaration order below), then the payload.
import:
  - draft.yaml
  - task.yaml

variants:
  - list_all:            # no type -> a unit variant
  - create: draft
  - read: uint64
  - update: task
  - delete: uint64
