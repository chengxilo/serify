# yaml-language-server: $schema=.schemas/result.schema.json
# What the server answers with. A sum again, and for the same reason: a response
# is a task, or a page of tasks, or an acknowledgement, or an error — never two
# of those, and never a task and an error both left half-filled.
#
# The tags are named for the outcome rather than the operation, because several
# operations share one: create, read and update all answer `found`.
#
# Wire: u8 tag ordinal (declaration order below), then the payload.
import:
  - task.yaml
  - task_page.yaml
  - api_error.yaml

variants:
  - accepted:            # a delete that worked: nothing to send back
  - found: task
  - listing: task_page
  - failed: api_error
