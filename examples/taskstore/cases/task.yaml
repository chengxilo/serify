# yaml-language-server: $schema=.schemas/task.schema.json
# A stored task — the resource this server does CRUD on.
#
# Reusable-only (no `cases:`): a task never travels on its own. It reaches the
# client inside a response and the server inside an update, and those two are
# what the suite tests.
#
# Binary layout (little-endian, conventions in go/api/wire.go):
#
#   id        u64
#   title     u32 byte length + UTF-8 bytes
#   done      u8   0 or 1
#   priority  u8   ordinal: 0=low 1=normal 2=high
#   tags      u32 count + each tag as a length-prefixed string
#   due_at    u8 presence flag, then i64 unix seconds if present
fields:
  - id: uint64
  - title: string
  - done: bool
  - priority: "enum<low, normal, high>"
  - tags: list<string>
  - due_at: optional<int64>
