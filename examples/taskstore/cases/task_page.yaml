# yaml-language-server: $schema=.schemas/task_page.schema.json
# The body of a list response: the tasks on this page, plus how many exist in
# total. The `total` is why this is a struct and not a bare list<task> — a list
# endpoint that cannot say how much it did not return is one that has to be
# redesigned the first time the store outgrows a page.
import:
  - task.yaml

fields:
  - items: list<task>
  - total: uint32
