# Standalone crate (its own [workspace]) so the `worker` binary does not collide
# with the example worker in the repo's main Cargo workspace, and so this
# directory is copyable on its own.
[workspace]

[package]
name = "taskstore-example"
version = "0.1.0"
edition = "2021"

[lib]
name = "taskstore"
path = "src/lib.rs"

# src/bin/worker.rs and src/bin/client.rs are picked up automatically.

[dependencies]
# The full dependency, because this crate holds the conformance worker as well
# as the codec. A crate shipping only the codec takes
# `serify = { version = "0.1", default-features = false }`, which keeps
# `#[derive(SerifyModel)]` and drops the NDJSON runtime, serde_json and hex.
serify = { path = "../../../lib/rust/serify" }
