[package]
name = "serify"
version = "0.1.0"
edition = "2021"
description = "Cross-language serialization conformance worker library for Rust"
license = "Apache-2.0"
repository = "https://github.com/chengxilo/serify"
keywords = ["serialization", "conformance", "testing"]
readme = "README.md"

[lib]
name = "serify"
path = "src/lib.rs"

[features]
# The NDJSON worker protocol (`run_suite`) and its JSON/hex codec. On by default:
# a conformance worker wants it. A crate that only wants `#[derive(SerifyModel)]`
# on its own types should take serify with `default-features = false`, which
# drops serde_json and hex from its dependency graph entirely.
default = ["worker"]
worker = ["dep:serde_json", "dep:hex"]

[dependencies]
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
serify-derive = { version = "0.1.0", path = "../derive" }
