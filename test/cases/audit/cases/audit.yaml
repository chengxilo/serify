# yaml-language-server: $schema=.schemas/audit.schema.json
# `audit` is a meta-test type: it drives deliberately-broken workers to verify
# that serify's --audit mode correctly detects 7 unsafe behaviours:
#   1. Serialize mutation       (mutating format)
#   2. Value-receiver mutation  (value-mutating format, Go only)
#   3. Deserialize zero-copy    (zero-copy format)
#   4. List-string zero-copy    (list-zero-copy format)
#   5. Serialize instability    (unstable format)
#   6. Deserialize instability  (deser-unstable format)
#   7. Input-buffer mutation    (input-mutating format)
#   8. Output zero-copy         (output-zero-copy format)
# The clean format serves as a control group — no warnings should be reported.

fields:
  - payload: bytes
  - tag: string
  - value: uint32
  - tags: list<string>

formats:
  - name: clean
    oracle: bytes
  - name: mutating
    oracle: bytes
  - name: value-mutating
    oracle: bytes
  - name: zero-copy
    oracle: bytes
  - name: list-zero-copy
    oracle: bytes
  - name: unstable
    oracle: bytes
  - name: deser-unstable
    oracle: bytes
  - name: input-mutating
    oracle: bytes
  - name: output-zero-copy
    oracle: bytes

cases:
  - name: basic
    data:
      payload: [0xde, 0xad, 0xbe, 0xef]
      tag: "hello"
      value: 42
      tags: ["alpha", "beta"]
