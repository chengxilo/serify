# `wrong` type with a crash-injection format.
# The crash format calls os.Exit(3) / std::process::exit(3) during serialization.
fields:
  - binary_serialize: bool
  - binary_deserialize: bool
  - json_serialize: bool
  - json_deserialize: bool
  - langs: list<string>

# yaml-language-server: $schema=.schemas/wrong.schema.json
formats:
  - name: crash
    oracle: bytes

_langs: &langs
  - go
  - rust

cases:
  - name: abort
    description: "Serializer crashes the worker process."
    data:
      binary_serialize: true
      binary_deserialize: true
      json_serialize: true
      json_deserialize: true
      langs: *langs
