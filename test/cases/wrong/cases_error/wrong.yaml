# `wrong` type with error-injection formats.
# All directive flags are true (inert — they only satisfy the shared model).
# Fault behaviour comes from the format names themselves (err_ser, err_deser).
fields:
  - binary_serialize: bool
  - binary_deserialize: bool
  - json_serialize: bool
  - json_deserialize: bool
  - langs: list<string>

# yaml-language-server: $schema=.schemas/wrong.schema.json
formats:
  - name: err_ser
    oracle: bytes
  - name: err_deser
    oracle: bytes

_langs: &langs
  - go
  - rust

cases:
  - name: boom
    description: "Serialize error on err_ser, deserialize error on err_deser."
    data:
      binary_serialize: true
      binary_deserialize: true
      json_serialize: true
      json_deserialize: true
      langs: *langs
