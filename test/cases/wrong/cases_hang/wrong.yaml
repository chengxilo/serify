# `wrong` type with a hang-injection format.
# The hang format sleeps 3 s before serializing — triggers worker timeout.
# yaml-language-server: $schema=.schemas/wrong.schema.json
fields:
  - binary_serialize: bool
  - binary_deserialize: bool
  - json_serialize: bool
  - json_deserialize: bool
  - langs: list<string>

formats:
  - hang

_langs: &langs
  - go
  - rust

cases:
  - name: sleeper
    description: "Serializer hangs for 3 s — must hit the CLI timeout."
    data:
      binary_serialize: true
      binary_deserialize: true
      json_serialize: true
      json_deserialize: true
      langs: *langs
