# Known-failures fixture for the `wrong` worker's cases_error suite
# (used by TestCLI_KnownFailures in test/faults_test.go).
#
# Both entries forgive the worker-reported protocol error the err_* format
# injects. On the op that succeeds anyway (err_deser's serialize), the entry
# must surface as XPASS, not PASS.
known_failures:
  - test_id: wrong/err_ser/boom
    reason: csharp err_ser injects a serialize error
  - test_id: wrong/err_deser/boom
    reason: csharp err_deser injects a deserialize error
